name: CI — Build, Verify & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel any in-flight run for the same branch/ref so we don't waste minutes.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/apex-web
  NODE_VERSION: "20"

jobs:
  # ────────────────────────────────────────────────────────────
  # 1) Lint, type-check and build for every PR + push.
  #    Runs on GitHub-hosted runner (ephemeral).
  # ────────────────────────────────────────────────────────────
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Type-check & build
        run: npm run build

  # ────────────────────────────────────────────────────────────
  # 2) Push image to GHCR.
  #    Skipped on pull requests.
  # ────────────────────────────────────────────────────────────
  push-image:
    name: Push Image to GHCR
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
              type=sha,prefix=,format=short
              type=ref,event=branch
              type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────────────────────
  # 3) Deploy — runs on the VPS itself (self-hosted runner).
  #    No SSH keys / secrets. Just `docker compose pull && up -d`.
  # ────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS (Docker)
    runs-on: [self-hosted, apex-prod, linux, x64]
    needs: [build, push-image]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: http://${{ runner.ip }}:20983

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run deploy script
        run: |
          set -euo pipefail
          chmod +x ./deploy.sh
          ./deploy.sh

      - name: Show container logs (on failure)
        if: failure()
        run: |
          cd /opt/apex-web || true
          docker compose logs --tail=100 web || true
